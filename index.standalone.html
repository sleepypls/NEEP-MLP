const TEAM_COLORS = [

  { accent: '#a3e635', chip: 'bg-lime-500', text: 'text-lime-400', border: 'border-lime-500', ring: 'ring-lime-400', soft: 'bg-lime-500/10' },
  { accent: '#c084fc', chip: 'bg-purple-500', text: 'text-purple-400', border: 'border-purple-500', ring: 'ring-purple-400', soft: 'bg-purple-500/10' },

// ---------- Pure helpers (no React) ----------

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Fixed doubles partnerships from draft order: 1st+last, 2nd+2nd-last, etc.
function generatePairs(draftOrder) {
  const pairs = [];
  const n = draftOrder.length;
  for (let i = 0; i < Math.floor(n / 2); i++) {
    pairs.push([draftOrder[i], draftOrder[n - 1 - i]]);
  }
  return pairs;
}

// Generate fair, balanced pairings for any team size and game count
function generateTeamPairsForGames(draftOrder, totalGames) {
  const n = draftOrder.length;
  if (n < 2) return [];
  const playCounts = {};
  draftOrder.forEach((id) => { playCounts[id] = 0; });
  const pairHistory = new Map();

  const pairs = [];
  for (let g = 0; g < totalGames; g++) {
    // Sort players by play count ascending, tie-break with random shuffle
    const candidates = shuffle([...draftOrder]).sort((a, b) => playCounts[a] - playCounts[b]);
    const p1 = candidates[0];
    let bestP2 = candidates[1];
    let bestScore = Infinity;
    for (let i = 1; i < candidates.length; i++) {
      const p2 = candidates[i];
      const key = p1 < p2 ? `${p1}-${p2}` : `${p2}-${p1}`;
      const timesTogether = pairHistory.get(key) || 0;
      const score = timesTogether * 100 + playCounts[p2];
      if (score < bestScore) {
        bestScore = score;
        bestP2 = p2;
      }
    }
    playCounts[p1]++;
    playCounts[bestP2]++;
    const pairKey = p1 < bestP2 ? `${p1}-${bestP2}` : `${bestP2}-${p1}`;
    pairHistory.set(pairKey, (pairHistory.get(pairKey) || 0) + 1);
    pairs.push([p1, bestP2]);
  }
  return pairs;
}

// Generates regulation games. For standard 4v4 teams, uses classic MLP fixed pairs.
// For uneven or odd teams, generates the required games (even total so ties can occur)
// ensuring every player plays at least 2 games, and randomizes matchups for additional games.
function generateGames(teamA, teamB, goalScore) {
  const nA = teamA.draftOrder.length;
  const nB = teamB.draftOrder.length;
  const isStandard4v4 = nA === 4 && nB === 4;

  if (isStandard4v4) {
    const pairsA = generatePairs(teamA.draftOrder);
    const pairsB = generatePairs(teamB.draftOrder);
    const numPairs = pairsA.length;
    const games = [];
    for (let i = 0; i < numPairs; i++) {
      games.push({ pairA: pairsA[i], pairB: pairsB[i] });
    }
    for (let i = 0; i < numPairs; i++) {
      games.push({ pairA: pairsA[i], pairB: pairsB[(i + 1) % numPairs] });
    }
    return games.map((g, idx) => ({
      id: idx,
      pairA: g.pairA,
      pairB: g.pairB,
      scoreA: goalScore,
      scoreB: goalScore,
      saved: false,
      isExtra: false,
      randomized: false,
    }));
  }

  // Uneven or odd teams:
  const baseGamesCount = Math.min(nA, nB, 4);
  // Total games must be an even number (so tie -> dreambreaker is possible) and >= max(nA, nB, 4)
  let totalGames = Math.max(nA, nB, 4);
  if (totalGames % 2 !== 0) totalGames += 1;

  const pairsA = generateTeamPairsForGames(teamA.draftOrder, totalGames);
  const pairsB = generateTeamPairsForGames(teamB.draftOrder, totalGames);

  return Array.from({ length: totalGames }, (_, idx) => {
    const isExtra = idx >= baseGamesCount;
    return {
      id: idx,
      pairA: pairsA[idx],
      pairB: pairsB[idx],
      scoreA: goalScore,
      scoreB: goalScore,
      saved: false,
      isExtra,
      randomized: isExtra || (nA !== nB),
    };
  });
}

function initializeDraftState(playerPool, numTeams, allowUneven = true) {
  const shuffled = shuffle(playerPool);
  let draftPlayers, sittingOut;

  if (allowUneven) {
    draftPlayers = shuffled;
    sittingOut = [];
  } else {
    const teamSize = Math.floor(playerPool.length / numTeams);
    const totalDrafted = teamSize * numTeams;
    draftPlayers = shuffled.slice(0, totalDrafted);
    sittingOut = shuffled.slice(totalDrafted);
  }

  const captains = draftPlayers.slice(0, numTeams);
  const remainingPool = draftPlayers.slice(numTeams);

  const teams = captains.map((cap, i) => ({
    id: i,
    name: `Team ${cap.name}`,
    color: TEAM_COLORS[i % TEAM_COLORS.length],
    captainId: cap.id,
    draftOrder: [cap.id],
  }));

  // Snake draft sequence: drafts until remainingPool is empty
  const pickSequence = [];
  let round = 1;
  let draftedCount = 0;
  const needed = remainingPool.length;
  while (draftedCount < needed) {
    const order = [...Array(numTeams).keys()];
    if (round % 2 === 1) order.reverse();
    for (const teamIdx of order) {
      if (draftedCount < needed) {
        pickSequence.push(teamIdx);
        draftedCount++;
      }
    }
    round++;
  }

  const playersById = {};
  playerPool.forEach((p) => { playersById[p.id] = p.name; });

  return { teams, remainingPool, pickSequence, playersById, sittingOut, teamSize: Math.floor(draftPlayers.length / numTeams) };
}

function generateBracket(teamsInput) {
  const order = shuffle(teamsInput);
  const numTeams = order.length;
  const bracketSize = Math.pow(2, Math.ceil(Math.log2(Math.max(2, numTeams))));
  const numRounds = Math.log2(bracketSize);
  const rounds = [];

  const slots = new Array(bracketSize).fill(null);
  for (let i = 0; i < numTeams; i++) {
    slots[i] = order[i].id;
  }

  const round0 = [];
  for (let i = 0; i < bracketSize; i += 2) {
    const teamAId = slots[i];
    const teamBId = slots[i + 1];
    const isBye = teamAId !== null && teamBId === null;
    round0.push({
      id: `r0-m${i / 2}`,
      teamAId,
      teamBId,
      status: isBye ? 'complete' : 'ready',
      games: null,
      gamesWonA: 0,
      gamesWonB: 0,
      winnerId: isBye ? teamAId : null,
      dreambreaker: null,
      isBye,
    });
  }
  rounds.push(round0);

  for (let r = 1; r < numRounds; r++) {
    const count = bracketSize / Math.pow(2, r + 1);
    const matches = [];
    for (let i = 0; i < count; i++) {
      matches.push({
        id: `r${r}-m${i}`,
        teamAId: null,
        teamBId: null,
        status: 'pending',
        games: null,
        gamesWonA: 0,
        gamesWonB: 0,
        winnerId: null,
        dreambreaker: null,
      });
    }
    rounds.push(matches);
  }

  // Advance byes into Round 1
  for (let mi = 0; mi < round0.length; mi++) {
    if (round0[mi].isBye && rounds.length > 1) {
      const nextIdx = Math.floor(mi / 2);
      const slot = mi % 2 === 0 ? 'teamAId' : 'teamBId';
      rounds[1][nextIdx][slot] = round0[mi].winnerId;
    }
  }
  if (rounds.length > 1) {
    rounds[1].forEach((m) => {
      if (m.teamAId !== null && m.teamBId !== null) m.status = 'ready';
    });
  }

  return { rounds, championId: null };
}

function advanceWinner(bracket, roundIdx, matchIdx, winnerId) {
  const nb = JSON.parse(JSON.stringify(bracket));
  const m = nb.rounds[roundIdx][matchIdx];
  m.winnerId = winnerId;
  m.status = 'complete';
  if (roundIdx + 1 < nb.rounds.length) {
    const nextIdx = Math.floor(matchIdx / 2);
    const slot = matchIdx % 2 === 0 ? 'teamAId' : 'teamBId';
    const nextMatch = nb.rounds[roundIdx + 1][nextIdx];
    nextMatch[slot] = winnerId;
    if (nextMatch.teamAId !== null && nextMatch.teamBId !== null) nextMatch.status = 'ready';
  } else {
    nb.championId = winnerId;
  }
  return nb;
}

function roundName(totalRounds, roundIdx) {
  const remaining = totalRounds - roundIdx;
  if (remaining === 1) return 'Final';
  if (remaining === 2) return 'Semifinals';
  if (remaining === 3) return 'Quarterfinals';
  return `Round ${roundIdx + 1}`;
}

function loadGlobalStats() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_STATS);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};

}

function saveGlobalStatsToStorage(stats) {
  try {
    localStorage.setItem(STORAGE_KEY_STATS, JSON.stringify(stats));
  } catch (e) {
    // localStorage unavailable -- fail silently, in-memory state still works
  }
}

function getPartnershipKey(nameA, nameB) {
  const normA = String(nameA).trim();
  const normB = String(nameB).trim();
  return [normA, normB].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' })).join(' & ');
}

function computeAllStats(priorPlayerStats = {}, priorPartnershipStats = {}, bracket = null, teams = [], playersById = {}) {
  const playerStats = JSON.parse(JSON.stringify(priorPlayerStats || {}));
  const partnershipStats = JSON.parse(JSON.stringify(priorPartnershipStats || {}));

  function ensurePlayer(id) {
    const name = playersById[id];
    if (!name) return null;
    const key = String(name).trim().toLowerCase();
    if (!playerStats[key]) {
      playerStats[key] = { name: String(name).trim(), matchesPlayed: 0, wins: 0, losses: 0, pointsWon: 0, pointsLost: 0, dreambreakerDiff: 0 };
    }
    return playerStats[key];
  }

  function ensurePair(id1, id2) {
    const name1 = playersById[id1];
    const name2 = playersById[id2];
    if (!name1 || !name2) return null;
    const key = getPartnershipKey(name1, name2);
    if (!partnershipStats[key]) {
      partnershipStats[key] = {
        name: key,
        names: [String(name1).trim(), String(name2).trim()],
        gamesPlayed: 0,
        wins: 0,
        losses: 0,
        pointsWon: 0,
        pointsLost: 0,
        pointDiff: 0,
      };
    }
    return partnershipStats[key];
  }

  if (bracket && bracket.rounds) {
    bracket.rounds.forEach((round) => {
      round.forEach((match) => {
        if (!match.games) return;
        const teamA = teams.find((t) => t.id === match.teamAId);
        const teamB = teams.find((t) => t.id === match.teamBId);
        if (!teamA || !teamB) return;

        match.games.forEach((g) => {
          if (!g.saved) return;
          // Individual points
          g.pairA.forEach((id) => {
            const p = ensurePlayer(id);
            if (p) { p.pointsWon += g.scoreA; p.pointsLost += g.scoreB; }
          });
          g.pairB.forEach((id) => {
            const p = ensurePlayer(id);
            if (p) { p.pointsWon += g.scoreB; p.pointsLost += g.scoreA; }
          });

          // Partnership stats
          const pairA = ensurePair(g.pairA[0], g.pairA[1]);
          const pairB = ensurePair(g.pairB[0], g.pairB[1]);
          if (pairA) {
            pairA.gamesPlayed += 1;
            if (g.scoreA > g.scoreB) pairA.wins += 1; else if (g.scoreB > g.scoreA) pairA.losses += 1;
            pairA.pointsWon += g.scoreA;
            pairA.pointsLost += g.scoreB;
            pairA.pointDiff += (g.scoreA - g.scoreB);
          }
          if (pairB) {
            pairB.gamesPlayed += 1;
            if (g.scoreB > g.scoreA) pairB.wins += 1; else if (g.scoreA > g.scoreB) pairB.losses += 1;
            pairB.pointsWon += g.scoreB;
            pairB.pointsLost += g.scoreA;
            pairB.pointDiff += (g.scoreB - g.scoreA);
          }
        });

        // Completed match record
        if (match.status === 'complete' && match.winnerId !== null) {
          teamA.draftOrder.forEach((id) => {
            const p = ensurePlayer(id);
            if (p) {
              p.matchesPlayed += 1;
              if (match.winnerId === teamA.id) p.wins += 1; else p.losses += 1;
            }
          });
          teamB.draftOrder.forEach((id) => {
            const p = ensurePlayer(id);
            if (p) {
              p.matchesPlayed += 1;
              if (match.winnerId === teamB.id) p.wins += 1; else p.losses += 1;
            }
          });
        }

        // Dreambreaker completed stats
        const db = match.dreambreaker;
        if (db && db.completed && db.playerStats) {
          Object.entries(db.playerStats).forEach(([idStr, ps]) => {
            const p = ensurePlayer(Number(idStr));
            if (p) {
              p.pointsWon += ps.pointsWon;
              p.pointsLost += ps.pointsLost;
              p.dreambreakerDiff += (ps.pointsWon - ps.pointsLost);
            }
          });
        }
      });
    });
  }

  return { playerStats, partnershipStats };
}

function loadTournamentState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_TOURNAMENT);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {

  }
}

function saveTournamentState(state) {

  }
}

function clearTournamentState() {
  try {
    localStorage.removeItem(STORAGE_KEY_TOURNAMENT);
  } catch (e) {
    // ignore

}

function ConfirmModal({ modal, onCancel }) {
  if (!modal) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm px-4">
      <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-sm shadow-2xl">
        <p className="text-slate-100 text-lg font-semibold mb-1">{modal.title}</p>
        <p className="text-slate-400 text-sm mb-5 leading-relaxed">{modal.message}</p>
        <div className="flex flex-col gap-2">
          {modal.secondaryConfirm && (
            <button
              onClick={modal.secondaryConfirm.onAction}
              className="w-full py-3 rounded-xl bg-[#d7f24c] text-slate-950 font-bold active:scale-95 transition shadow-lg shadow-[#d7f24c]/10"
            >
              {modal.secondaryConfirm.label}
            </button>
          )}
          <div className="flex gap-2">
            <button
              onClick={onCancel}
              className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-semibold active:scale-95 transition"
            >
              Cancel
            </button>
            <button
              onClick={modal.onConfirm}
              className={`flex-1 py-2.5 rounded-xl text-white font-semibold active:scale-95 transition ${modal.confirmColor || 'bg-red-600'}`}
            >
              {modal.confirmLabel || 'Confirm'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function TeamDot({ color, className = '' }) {
  return <span className={`inline-block w-3 h-3 rounded-full ${className}`} style={{ backgroundColor: color.accent }} />;
}

// ---------- Header ----------

function Header({ hasTournament, view, setView, onBracketTab, onClear, onWipeStats }) {
  return (
    <header className="sticky top-0 z-40 bg-slate-950/95 backdrop-blur border-b border-slate-800">
      <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
        <div className="flex items-center gap-2">
          <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-[#d7f24c] to-[#9fc93a] flex items-center justify-center shadow-lg shadow-[#d7f24c]/20">
            <Zap size={20} className="text-slate-950" strokeWidth={2.5} />
          </div>
          <div>
            <h1 className="font-display text-white font-semibold text-2xl leading-none tracking-wide uppercase">NEEP</h1>
            <p className="text-slate-500 text-[10px] leading-none uppercase tracking-widest">Pickleball Tracker</p>
          </div>
        </div>

        <div className="flex items-center gap-2">
          {hasTournament && (
            <div className="hidden sm:flex bg-slate-900 rounded-lg p-1 border border-slate-800">
              <button
                onClick={onBracketTab}
                className={`px-3 py-1.5 rounded-md text-sm font-semibold transition ${view === 'bracket' || view === 'match' || view === 'dreambreakerSetup' || view === 'dreambreakerPlay' || view === 'draft' ? 'bg-[#d7f24c] text-slate-950' : 'text-slate-400'}`}
              >
                Bracket
              </button>
              <button
                onClick={() => setView('leaderboard')}
                className={`px-3 py-1.5 rounded-md text-sm font-semibold transition ${view === 'leaderboard' ? 'bg-[#d7f24c] text-slate-950' : 'text-slate-400'}`}
              >
                Leaderboard
              </button>
            </div>
          )}
          {!hasTournament && (
            <button
              onClick={() => setView(view === 'leaderboard' ? 'setup' : 'leaderboard')}
              className="px-3 py-1.5 rounded-md text-sm font-semibold bg-slate-900 border border-slate-800 text-slate-300"
            >
              {view === 'leaderboard' ? 'Setup' : 'Leaderboard'}

          <button
            onClick={onClear}
            title="Clear Tournament"
            className="p-2 rounded-lg bg-slate-900 border border-slate-800 text-slate-400 active:scale-95"
          >
            <RotateCcw size={18} />
          </button>
          <button
            onClick={onWipeStats}
            title="Wipe Global Stats"
            className="p-2 rounded-lg bg-slate-900 border border-slate-800 text-red-400 active:scale-95"
          >
            <Trash2 size={18} />
          </button>
        </div>
      </div>
      {hasTournament && (
        <div className="sm:hidden flex border-t border-slate-800">
          <button
            onClick={onBracketTab}
            className={`flex-1 py-2 text-sm font-semibold ${view === 'bracket' || view === 'match' || view === 'dreambreakerSetup' || view === 'dreambreakerPlay' || view === 'draft' ? 'text-[#d7f24c] border-b-2 border-[#d7f24c]' : 'text-slate-500'}`}
          >
            Bracket
          </button>
          <button
            onClick={() => setView('leaderboard')}
            className={`flex-1 py-2 text-sm font-semibold ${view === 'leaderboard' ? 'text-[#d7f24c] border-b-2 border-[#d7f24c]' : 'text-slate-500'}`}

// ---------- Setup View ----------

function SetupView({
  playerPool,
  addPlayer,
  removePlayer,
  savedPlayers = [],
  onAddSavedPlayer,
  onAddAllSavedPlayers,
  onRemoveSavedPlayer,
  numTeams,
  setNumTeams,
  goalScore,
  setGoalScore,
  dreambreakerScore,
  setDreambreakerScore,
  allowUneven,
  setAllowUneven,
  onInitializeDraft,
}) {
  const [nameInput, setNameInput] = useState('');

  const baseTeamSize = numTeams ? Math.floor(playerPool.length / numTeams) : 0;
  const extraPlayers = numTeams ? playerPool.length % numTeams : 0;
  const meetsMinimum = playerPool.length >= numTeams * 2;
  const canInitialize = meetsMinimum && baseTeamSize >= 2;

  const availableSaved = (savedPlayers || []).filter(
    (name) => !playerPool.some((p) => p.name.trim().toLowerCase() === name.trim().toLowerCase())
  );

  function handleAdd() {
    const trimmed = nameInput.trim();
    if (!trimmed) return;
    addPlayer(trimmed);
    setNameInput('');
  }

  return (
    <div className="max-w-lg mx-auto px-4 py-6 pb-24">
      <h2 className="text-white text-3xl font-display uppercase tracking-wide font-semibold mb-1">Tournament Setup</h2>
      <p className="text-slate-500 text-sm mb-6 text-balance">Add your player pool, pick a bracket size, and set target score limits.</p>

      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-4">
        <label className="text-slate-300 text-sm font-semibold mb-2 block">Player Pool ({playerPool.length})</label>
        <div className="flex gap-2 mb-3">
          <input
            value={nameInput}
            onChange={(e) => setNameInput(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter') handleAdd(); }}
            placeholder="Player name"
            className="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 text-base focus:outline-none focus:ring-2 focus:ring-[#d7f24c]"
          />
          <button
            onClick={handleAdd}
            className="bg-[#d7f24c] text-slate-950 rounded-xl px-4 py-3 font-bold active:scale-95 transition flex items-center gap-1"
          >
            <UserPlus size={20} />
          </button>
        </div>

        {playerPool.length === 0 ? (
          <p className="text-slate-600 text-sm italic py-2">No players yet. Add at least {numTeams * 2} to start a draft.</p>
        ) : (
          <div className="flex flex-wrap gap-2">
            {playerPool.map((p) => (
              <span key={p.id} className="flex items-center gap-1.5 bg-slate-800 border border-slate-700 rounded-full pl-3 pr-1.5 py-1.5 text-slate-200 text-sm font-medium">
                {p.name}
                <button onClick={() => removePlayer(p.id)} className="p-1 rounded-full hover:bg-slate-700 text-slate-400">
                  <XIcon size={14} />
                </button>
              </span>
            ))}
          </div>
        )}

        {availableSaved.length > 0 && (
          <div className="mt-4 pt-3.5 border-t border-slate-800/80">
            <div className="flex items-center justify-between mb-2">
              <span className="text-slate-400 text-xs font-bold uppercase tracking-wider flex items-center gap-1.5">
                <Users size={13} className="text-[#d7f24c]" /> Saved Players ({availableSaved.length})
              </span>
              <button
                onClick={onAddAllSavedPlayers}
                className="text-xs font-bold text-[#d7f24c] hover:underline flex items-center gap-1 active:scale-95 transition"
              >
                <UserPlus size={13} /> + Add All ({availableSaved.length})
              </button>
            </div>
            <div className="flex flex-wrap gap-1.5">
              {availableSaved.map((name) => (
                <span
                  key={name}
                  className="group inline-flex items-center gap-1.5 bg-slate-800/70 hover:bg-slate-750 border border-slate-700/60 rounded-full pl-2.5 pr-1 py-0.5 text-slate-300 text-xs transition"
                >
                  <button
                    onClick={() => onAddSavedPlayer(name)}
                    className="font-medium hover:text-white flex items-center gap-1"
                    title={`Add ${name} to tournament`}
                  >
                    <span>{name}</span>
                    <span className="text-emerald-400 font-bold text-sm leading-none">+</span>
                  </button>
                  <button
                    onClick={() => onRemoveSavedPlayer(name)}
                    className="text-slate-600 hover:text-red-400 p-0.5 rounded-full transition"
                    title={`Remove ${name} from saved list`}
                  >
                    <XIcon size={11} />
                  </button>
                </span>
              ))}
            </div>
          </div>
        )}
      </div>

      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-4">
        <label className="text-slate-300 text-sm font-semibold mb-2 block">Number of Teams</label>
        <select
          value={numTeams}
          onChange={(e) => setNumTeams(Number(e.target.value))}
          className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-base focus:outline-none focus:ring-2 focus:ring-[#d7f24c]"
        >
          <option value={2}>2 Teams (Final only)</option>
          <option value={3}>3 Teams (Semis + Final, with Bye)</option>
          <option value={4}>4 Teams (Semis + Final)</option>
          <option value={5}>5 Teams (Quarters, Semis, Final, with Byes)</option>
          <option value={6}>6 Teams (Quarters, Semis, Final, with Byes)</option>
          <option value={7}>7 Teams (Quarters, Semis, Final, with Byes)</option>
          <option value={8}>8 Teams (Quarters, Semis, Final)</option>
        </select>
      </div>

      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-4">
        <label className="text-slate-300 text-sm font-semibold mb-2 block">Regulation Goal Score Limit</label>
        <input
          type="number"
          min={1}
          value={goalScore}
          onChange={(e) => setGoalScore(Math.max(1, Number(e.target.value) || 1))}
          className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-base mb-3 focus:outline-none focus:ring-2 focus:ring-[#d7f24c]"
        />
        <div className="flex gap-2">
          {[11, 15, 21].map((v) => (
            <button
              key={v}
              onClick={() => setGoalScore(v)}
              className={`flex-1 py-2 rounded-lg font-bold text-sm transition ${goalScore === v ? 'bg-[#d7f24c] text-slate-950' : 'bg-slate-800 text-slate-300'}`}
            >
              {v}
            </button>
          ))}
        </div>
      </div>

      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-4">
        <div className="flex items-center justify-between mb-2">
          <label className="text-slate-300 text-sm font-semibold flex items-center gap-1.5">
            <Zap size={16} className="text-amber-400" /> Dreambreaker Score Limit
          </label>
          <span className="text-slate-400 text-xs font-mono">Win by 2</span>
        </div>
        <input
          type="number"
          min={1}
          value={dreambreakerScore}
          onChange={(e) => setDreambreakerScore(Math.max(1, Number(e.target.value) || 1))}
          className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-base mb-3 focus:outline-none focus:ring-2 focus:ring-amber-400"
        />
        <div className="flex gap-2">
          {[11, 15, 21].map((v) => (
            <button
              key={v}
              onClick={() => setDreambreakerScore(v)}
              className={`flex-1 py-2 rounded-lg font-bold text-sm transition ${dreambreakerScore === v ? 'bg-amber-500 text-slate-950 font-black shadow-md' : 'bg-slate-800 text-slate-300'}`}
            >
              {v}
            </button>
          ))}
        </div>
      </div>

      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-4">
        <label className="flex items-center justify-between cursor-pointer">
          <div>
            <span className="text-white text-sm font-semibold block">Allow Uneven Teams</span>
            <span className="text-slate-400 text-xs">Draft all players; randomize extra games required</span>
          </div>
          <input
            type="checkbox"
            checked={allowUneven}
            onChange={(e) => setAllowUneven(e.target.checked)}
            className="w-5 h-5 rounded bg-slate-800 border-slate-700 text-[#d7f24c] focus:ring-0 cursor-pointer accent-[#d7f24c]"
          />
        </label>
      </div>

      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-6 text-sm">
        <p className="text-slate-400">
          With <span className="text-white font-bold">{playerPool.length}</span> players across{' '}
          <span className="text-white font-bold">{numTeams}</span> teams, teams will have{' '}
          <span className="text-white font-bold">{allowUneven && extraPlayers > 0 ? `${baseTeamSize}–${baseTeamSize + 1}` : baseTeamSize}</span> player{baseTeamSize === 1 ? '' : 's'} each.
          {allowUneven && extraPlayers > 0 && (
            <span className="text-amber-400 block mt-1.5 font-medium">
              &bull; {extraPlayers} team{extraPlayers === 1 ? '' : 's'} will have {baseTeamSize + 1} players. Additional games will be automatically scheduled with randomized matchups so everyone plays!
            </span>
          )}
          {!allowUneven && extraPlayers > 0 && (
            <span className="text-amber-400 block mt-1.5">
              &bull; {extraPlayers} player{extraPlayers === 1 ? '' : 's'} will sit out (uneven split).
            </span>
          )}
          {baseTeamSize > 0 && baseTeamSize % 2 !== 0 && (!allowUneven || extraPlayers === 0) && (
            <span className="text-amber-400 block mt-1.5 font-medium">
              &bull; Odd team size ({baseTeamSize}/team): Extra regulation games will be randomized to ensure balanced court time.
            </span>
          )}
        </p>
        {!meetsMinimum && (
          <p className="text-red-400 mt-2 font-semibold">Need at least {numTeams * 2} players ({numTeams * 2 - playerPool.length} more) for {numTeams} teams.</p>
        )}
      </div>

      <button
        disabled={!canInitialize}
        onClick={onInitializeDraft}
        className={`w-full py-4 rounded-2xl font-extrabold text-lg flex items-center justify-center gap-2 transition active:scale-95 ${canInitialize ? 'bg-[#d7f24c] text-slate-950 shadow-lg shadow-[#d7f24c]/20' : 'bg-slate-800 text-slate-600 cursor-not-allowed'}`}
      >
        <Shuffle size={22} /> Initialize Draft
      </button>
    </div>
  );
}

// ---------- Draft View ----------

function DraftView({ teams, remainingPool, pickSequence, pickPointer, playersById, sittingOut, onDraftPlayer, onGenerateBracket }) {
  const draftComplete = pickPointer >= pickSequence.length;
  const currentTeamIdx = draftComplete ? null : pickSequence[pickPointer];

  return (
    <div className="max-w-2xl mx-auto px-4 py-6 pb-24">
      <h2 className="text-white text-3xl font-display uppercase tracking-wide font-semibold mb-1 flex items-center gap-2"><Shuffle size={24} className="text-[#d7f24c]" /> Snake Draft</h2>
      {!draftComplete ? (
        <p className="text-slate-400 text-sm mb-6">
          Pick {pickPointer + 1} of {pickSequence.length} &mdash; it's{' '}
          <span className="font-bold" style={{ color: teams[currentTeamIdx].color.accent }}>{teams[currentTeamIdx].name}'s</span> turn.
        </p>
      ) : (
        <p className="text-[#d7f24c] text-sm mb-6 font-semibold">Draft complete! Every roster is locked in.</p>
      )}

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
        {teams.map((t, ti) => (
          <div
            key={t.id}
            className={`rounded-2xl p-4 border-2 bg-slate-900 transition ${currentTeamIdx === ti ? `${t.color.border} shadow-lg` : 'border-slate-800'}`}
          >
            <div className="flex items-center gap-2 mb-2">
              <TeamDot color={t.color} />
              <h3 className="text-white font-bold">{t.name}</h3>
              {currentTeamIdx === ti && <span className="ml-auto text-[10px] uppercase tracking-wide font-bold px-2 py-0.5 rounded-full bg-slate-800" style={{ color: t.color.accent }}>On the clock</span>}
            </div>
            <ol className="space-y-1">
              {t.draftOrder.map((pid, i) => (
                <li key={pid} className="text-sm text-slate-300 flex items-center gap-2">
                  <span className="w-5 h-5 flex items-center justify-center rounded-full bg-slate-800 text-[10px] font-bold text-slate-400">{i + 1}</span>
                  {playersById[pid]}
                  {i === 0 && <span className="text-[10px] uppercase font-bold" style={{ color: t.color.accent }}>Captain</span>}
                </li>
              ))}
            </ol>
          </div>
        ))}
      </div>

      {!draftComplete && (
        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-6">
          <p className="text-slate-300 text-sm font-semibold mb-3">Available Players</p>
          <div className="flex flex-wrap gap-2">
            {remainingPool.map((p) => (
              <button
                key={p.id}
                onClick={() => onDraftPlayer(p.id)}
                className="bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-full px-4 py-2.5 text-white text-sm font-semibold active:scale-95 transition"
              >
                {p.name}
              </button>
            ))}
          </div>
        </div>
      )}

      {sittingOut.length > 0 && (
        <p className="text-amber-400 text-xs mb-4">Sitting out this tournament: {sittingOut.map((p) => p.name).join(', ')}</p>
      )}

      {draftComplete && (
        <button
          onClick={onGenerateBracket}
          className="w-full py-4 rounded-2xl font-extrabold text-lg bg-[#d7f24c] text-slate-950 shadow-lg shadow-[#d7f24c]/20 flex items-center justify-center gap-2 active:scale-95 transition"
        >
          <Trophy size={22} /> Generate Bracket
        </button>
      )}
    </div>
  );
}

// ---------- Bracket View ----------

function MatchCard({ match, teams, onOpen }) {
  const teamA = match.teamAId !== null ? teams.find((t) => t.id === match.teamAId) : null;
  const teamB = match.teamBId !== null ? teams.find((t) => t.id === match.teamBId) : null;
  const clickable = teamA && teamB;
  const isComplete = match.status === 'complete';

  return (
    <button
      onClick={() => clickable && onOpen()}
      disabled={!clickable}
      className={`w-full text-left bg-slate-900 border rounded-xl p-3 mb-3 transition ${clickable ? 'border-slate-700 active:scale-[0.98] hover:border-slate-600' : 'border-slate-800 opacity-60 cursor-default'}`}
    >
      {[
        { team: teamA, score: match.gamesWonA, id: match.teamAId },
        { team: teamB, score: match.gamesWonB, id: match.teamBId, isByeRow: match.isBye && !teamB },
      ].map((row, i) => (
        <div key={i} className={`flex items-center justify-between py-1.5 px-2 rounded-lg ${isComplete && match.winnerId === row.id ? 'bg-slate-800' : ''}`}>
          <span className="flex items-center gap-2 text-sm font-semibold truncate">
            {row.team ? <TeamDot color={row.team.color} /> : <span className="w-3 h-3 rounded-full bg-slate-700" />}
            <span className={row.team ? (isComplete && match.winnerId === row.id ? 'text-white' : 'text-slate-300') : (row.isByeRow ? 'text-amber-400/80 italic font-mono text-xs' : 'text-slate-600 italic')}>
              {row.team ? row.team.name : (row.isByeRow ? 'BYE (Advances)' : 'TBD')}
            </span>
            {isComplete && match.winnerId === row.id && <Trophy size={13} className="text-amber-400" />}
          </span>
          {match.games && <span className="text-slate-400 font-mono text-sm tabular-nums">{row.score}</span>}
        </div>
      ))}
      {match.isBye && <p className="text-amber-400/80 text-[11px] font-bold mt-1 uppercase tracking-wider">First-Round Bye</p>}
      {match.status === 'tied' && <p className="text-amber-400 text-[11px] font-bold mt-1 flex items-center gap-1"><Zap size={12} /> DREAMBREAKER</p>}
      {match.status === 'in_progress' && <p className="text-cyan-400 text-[11px] font-bold mt-1">IN PROGRESS</p>}
    </button>
  );
}

function BracketView({ bracket, teams, onOpenMatch }) {
  const totalRounds = bracket.rounds.length;
  const champion = bracket.championId !== null ? teams.find((t) => t.id === bracket.championId) : null;

  return (
    <div className="max-w-6xl mx-auto px-4 py-6 pb-24">
      {champion && (
        <div className="mb-6 rounded-2xl p-5 bg-gradient-to-br from-amber-500/20 to-amber-900/10 border border-amber-500/40 text-center">
          <Trophy size={36} className="mx-auto text-amber-400 mb-2" />
          <p className="text-amber-300 text-xs uppercase tracking-widest font-bold">Champion</p>
          <p className="text-white text-3xl font-display uppercase tracking-wide font-semibold">{champion.name}</p>
        </div>
      )}

      <h2 className="text-white text-3xl font-display uppercase tracking-wide font-semibold mb-4 flex items-center gap-2"><Swords size={24} className="text-[#d7f24c]" /> Tournament Bracket</h2>

      <div className="flex gap-4 overflow-x-auto pb-4 -mx-4 px-4 sm:mx-0 sm:px-0">
        {bracket.rounds.map((round, ri) => (
          <div key={ri} className="min-w-[260px] flex-1">
            <p className="text-slate-400 text-xs font-bold uppercase tracking-widest mb-3">{roundName(totalRounds, ri)}</p>
            {round.map((match, mi) => (
              <MatchCard key={match.id} match={match} teams={teams} onOpen={() => onOpenMatch(ri, mi)} />
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

// ---------- Match Dashboard (Regulation) ----------

function GameRow({ game, index, teamA, teamB, playersById, expanded, onToggle, onSave, readOnly }) {
  const [scoreA, setScoreA] = useState(game.scoreA);
  const [scoreB, setScoreB] = useState(game.scoreB);
  const [isEditing, setIsEditing] = useState(false);

  useEffect(() => {
    setScoreA(game.scoreA);
    setScoreB(game.scoreB);
  }, [game.scoreA, game.scoreB]);

  const label = (ids) => ids.map((id) => playersById[id]).join(' & ');
  const aWon = game.saved && game.scoreA > game.scoreB;
  const bWon = game.saved && game.scoreB > game.scoreA;

  function handleSaveClick() {
    onSave(scoreA, scoreB);
    setIsEditing(false);
  }

  function handleCancelClick() {
    setScoreA(game.scoreA);
    setScoreB(game.scoreB);
    setIsEditing(false);
  }

  return (
    <div className="bg-slate-900 border border-slate-800 rounded-xl mb-3 overflow-hidden">
      <button onClick={onToggle} className="w-full flex items-center justify-between px-4 py-3 text-left">
        <div>
          <div className="flex items-center gap-2 mb-0.5">
            <p className="text-slate-500 text-[11px] font-bold uppercase tracking-wide">Game {index + 1}</p>
            {game.isExtra && (
              <span className="inline-flex items-center gap-1 px-1.5 py-0.2 rounded text-[10px] font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30">
                <Shuffle size={10} /> Extra &bull; Randomized
              </span>
            )}
          </div>
          <p className="text-white text-sm font-semibold">
            <span className={aWon ? 'text-[#d7f24c]' : ''}>{label(game.pairA)}</span>
            <span className="text-slate-500"> vs </span>
            <span className={bWon ? 'text-[#d7f24c]' : ''}>{label(game.pairB)}</span>
          </p>
        </div>
        <div className="flex items-center gap-2">
          {game.saved && (
            <span className="font-mono text-slate-300 text-sm">{game.scoreA}-{game.scoreB}</span>
          )}
          {game.saved ? <Check size={18} className="text-[#d7f24c]" /> : <span className="w-2 h-2 rounded-full bg-amber-400" />}
          {expanded ? <ChevronUp size={18} className="text-slate-500" /> : <ChevronDown size={18} className="text-slate-500" />}
        </div>
      </button>
      {expanded && (
        <div className="px-4 pb-4 border-t border-slate-800 pt-3">
          <div className="grid grid-cols-2 gap-3 mb-3">
            <div>
              <label className="text-slate-400 text-xs font-semibold block mb-1">{teamA.name}</label>
              <input
                type="number"
                min={0}
                disabled={(!isEditing && game.saved) || readOnly}
                value={scoreA}
                onChange={(e) => setScoreA(Number(e.target.value))}
                className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-white text-lg font-bold text-center disabled:opacity-60 focus:outline-none focus:ring-2 focus:ring-[#d7f24c]"
              />
            </div>
            <div>
              <label className="text-slate-400 text-xs font-semibold block mb-1">{teamB.name}</label>
              <input
                type="number"
                min={0}
                disabled={(!isEditing && game.saved) || readOnly}
                value={scoreB}
                onChange={(e) => setScoreB(Number(e.target.value))}
                className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-white text-lg font-bold text-center disabled:opacity-60 focus:outline-none focus:ring-2 focus:ring-[#d7f24c]"
              />
            </div>
          </div>
          {!game.saved && !readOnly && (
            <button
              onClick={handleSaveClick}
              className="w-full py-3 rounded-xl bg-[#d7f24c] text-slate-950 font-bold active:scale-95 transition shadow-lg shadow-[#d7f24c]/20"
            >
              Save Game
            </button>
          )}
          {game.saved && !readOnly && !isEditing && (
            <button
              onClick={() => setIsEditing(true)}
              className="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-750 text-slate-200 font-bold flex items-center justify-center gap-2 active:scale-95 transition border border-slate-700 hover:border-slate-600"
            >
              <Pencil size={14} className="text-[#d7f24c]" /> Edit Game Score
            </button>
          )}
          {game.saved && !readOnly && isEditing && (
            <div className="flex gap-2">
              <button
                onClick={handleCancelClick}
                className="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-750 text-slate-300 font-bold active:scale-95 transition border border-slate-700"
              >
                Cancel
              </button>
              <button
                onClick={handleSaveClick}
                className="flex-1 py-2.5 rounded-xl bg-[#d7f24c] text-slate-950 font-bold active:scale-95 transition shadow-lg shadow-[#d7f24c]/20"
              >
                Update Score
              </button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function MatchDashboard({ match, teamA, teamB, playersById, onSaveGame, onBack, onGoToDreambreaker, onGoToBracket, onReRandomizeExtra, readOnly }) {
  const [expandedId, setExpandedId] = useState(null);

  if (!match.games) return null;
  const allSaved = match.games.every((g) => g.saved);
  const isTie = match.status === 'tied';
  const isDone = match.status === 'complete';
  const hasUnsavedExtra = match.games.some((g) => g.isExtra && !g.saved);

  return (
    <div className="max-w-2xl mx-auto px-4 py-6 pb-24">
      <div className="flex items-center justify-between mb-4">
        <button onClick={onBack} className="flex items-center gap-1 text-slate-400 text-sm font-semibold">
          <ArrowLeft size={16} /> Back to Bracket
        </button>
        {hasUnsavedExtra && !readOnly && (
          <button
            onClick={onReRandomizeExtra}
            title="Re-randomize player pairings for unsaved extra games"
            className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-bold border border-amber-500/30 active:scale-95 transition"
          >
            <Shuffle size={13} /> Re-randomize Extra Games
          </button>
        )}
      </div>

      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-4">
        <div className="flex items-center justify-between mb-1">
          <span className="flex items-center gap-2 font-bold text-white"><TeamDot color={teamA.color} />{teamA.name}</span>
          <span className="text-4xl font-display text-white tabular-nums">{match.gamesWonA} - {match.gamesWonB}</span>
          <span className="flex items-center gap-2 font-bold text-white">{teamB.name}<TeamDot color={teamB.color} /></span>
        </div>
        <p className="text-slate-500 text-xs text-center">Regulation &mdash; first to win the most of {match.games.length} games</p>
      </div>

      {isTie && (
        <div className="bg-amber-500/10 border border-amber-500/40 rounded-2xl p-4 mb-4 text-center">
          <p className="text-amber-400 font-extrabold flex items-center justify-center gap-2 mb-1"><Zap size={18} /> Match Tied! Dreambreaker Required.</p>
          <button onClick={onGoToDreambreaker} className="mt-2 w-full py-3 rounded-xl bg-amber-500 text-slate-950 font-bold active:scale-95 transition">
            Set Up Dreambreaker
          </button>
        </div>
      )}

      {isDone && !isTie && (
        <div className="bg-[#d7f24c]/10 border border-[#d7f24c]/40 rounded-2xl p-4 mb-4 text-center">
          <p className="text-[#d7f24c] font-extrabold flex items-center justify-center gap-2"><Trophy size={18} /> {match.winnerId === teamA.id ? teamA.name : teamB.name} wins the match!</p>
          <button onClick={onGoToBracket} className="mt-3 w-full py-3 rounded-xl bg-[#d7f24c] text-slate-950 font-bold active:scale-95 transition">
            Back to Bracket
          </button>
        </div>
      )}

      {match.games.map((g, i) => (
        <GameRow
          key={g.id}
          game={g}
          index={i}
          teamA={teamA}
          teamB={teamB}
          playersById={playersById}
          expanded={expandedId === g.id}
          onToggle={() => setExpandedId(expandedId === g.id ? null : g.id)}
          onSave={(a, b) => onSaveGame(g.id, a, b)}
          readOnly={readOnly}
        />
      ))}
    </div>
  );
}

function LineupBuilder({ team, lineup, locked, playersById, onMove, onLock }) {
  return (
    <div className={`rounded-2xl border-2 p-4 bg-slate-900 ${team.color.border}`}>
      <div className="flex items-center justify-between mb-3">
        <span className="flex items-center gap-2 font-bold text-white"><TeamDot color={team.color} />{team.name}</span>
        {locked && <span className="flex items-center gap-1 text-[#d7f24c] text-xs font-bold"><Lock size={14} /> LOCKED</span>}
      </div>
      {locked ? (
        <p className="text-slate-500 text-sm italic py-4 text-center">Lineup locked &mdash; hidden until Dreambreaker starts.</p>
      ) : (
        <ol className="space-y-2">
          {lineup.map((pid, i) => (
            <li key={pid} className="flex items-center gap-2 bg-slate-800 rounded-lg px-3 py-2">
              <span className="w-6 h-6 flex items-center justify-center rounded-full bg-slate-700 text-xs font-bold text-slate-300">{i + 1}</span>
              <span className="text-white text-sm font-semibold flex-1">{playersById[pid]}</span>
              <button disabled={i === 0} onClick={() => onMove(i, -1)} className="p-1.5 rounded-md bg-slate-700 disabled:opacity-30 text-slate-300"><ChevronUp size={16} /></button>
              <button disabled={i === lineup.length - 1} onClick={() => onMove(i, 1)} className="p-1.5 rounded-md bg-slate-700 disabled:opacity-30 text-slate-300"><ChevronDown size={16} /></button>
            </li>
          ))}
        </ol>
      )}
      {!locked && (
        <button onClick={onLock} className="w-full mt-3 py-3 rounded-xl bg-slate-700 text-white font-bold flex items-center justify-center gap-2 active:scale-95 transition">
          <Lock size={18} /> Lock Lineup
        </button>
      )}
    </div>
  );
}

function DreambreakerSetupView({ match, teamA, teamB, playersById, dreambreakerScore, onUpdateScoreLimit, onMove, onLock, onStart, onBack }) {
  const db = match.dreambreaker;
  const bothLocked = db.lockedA && db.lockedB;
  const currentGoalScore = db.goalScore || dreambreakerScore || 21;

  return (
    <div className="max-w-2xl mx-auto px-4 py-6 pb-24">
      <button onClick={onBack} className="flex items-center gap-1 text-slate-400 text-sm font-semibold mb-4">
        <ArrowLeft size={16} /> Back to Bracket
      </button>
      <div className="bg-amber-500/10 border border-amber-500/40 rounded-2xl p-4 mb-4 text-center">
        <p className="text-amber-400 font-extrabold flex items-center justify-center gap-2"><Zap size={18} /> Match Tied! Dreambreaker Required.</p>
        <p className="text-slate-400 text-xs mt-1">Each captain sets a blind rotation order for their full roster.</p>
      </div>

      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-6">
        <div className="flex items-center justify-between">
          <div>
            <p className="text-white text-sm font-bold flex items-center gap-1.5">
              <Zap size={15} className="text-amber-400" /> Dreambreaker Score Limit
            </p>
            <p className="text-slate-500 text-xs">Target score (win by 2)</p>
          </div>
          <div className="flex items-center gap-1.5">
            {[11, 15, 21].map((v) => (
              <button
                key={v}
                onClick={() => onUpdateScoreLimit(v)}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${currentGoalScore === v ? 'bg-amber-500 text-slate-950 shadow-md' : 'bg-slate-800 text-slate-300'}`}
              >
                {v}
              </button>
            ))}
            <input
              type="number"
              min={1}
              value={currentGoalScore}
              onChange={(e) => onUpdateScoreLimit(Math.max(1, Number(e.target.value) || 1))}
              className="w-14 bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-white text-sm font-bold text-center focus:outline-none focus:ring-2 focus:ring-amber-400"
            />
          </div>
        </div>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
        <LineupBuilder team={teamA} lineup={db.lineupA} locked={db.lockedA} playersById={playersById} onMove={(i, d) => onMove('A', i, d)} onLock={() => onLock('A')} />
        <LineupBuilder team={teamB} lineup={db.lineupB} locked={db.lockedB} playersById={playersById} onMove={(i, d) => onMove('B', i, d)} onLock={() => onLock('B')} />
      </div>

      <button
        disabled={!bothLocked}
        onClick={onStart}
        className={`w-full py-4 rounded-2xl font-extrabold text-lg flex items-center justify-center gap-2 transition active:scale-95 ${bothLocked ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20' : 'bg-slate-800 text-slate-600 cursor-not-allowed'}`}
      >
        <Play size={22} /> Start Dreambreaker
      </button>
    </div>
  );
}

// ---------- Dreambreaker Play ----------

function DreambreakerPlayView({ match, teamA, teamB, playersById, dreambreakerScore, showRotateBanner, onScore, onBack }) {
  const db = match.dreambreaker;
  const lenA = db.lineupA.length;
  const lenB = db.lineupB.length;
  const activeAId = db.lineupA[db.rotationIndex % lenA];
  const activeBId = db.lineupB[db.rotationIndex % lenB];
  const targetScore = db.goalScore || dreambreakerScore || 21;

  if (db.completed) {
    const winner = db.winnerId === teamA.id ? teamA : teamB;
    return (
      <div className="max-w-lg mx-auto px-4 py-10 text-center">
        <Trophy size={48} className="mx-auto text-amber-400 mb-3" />
        <p className="text-amber-300 text-xs uppercase tracking-widest font-bold">Dreambreaker Complete</p>
        <p className="text-white text-3xl font-extrabold mb-1">{winner.name} wins!</p>
        <p className="text-slate-400 font-mono text-xl mb-6">{db.scoreA} - {db.scoreB}</p>
        <button onClick={onBack} className="w-full py-4 rounded-2xl font-extrabold text-lg bg-[#d7f24c] text-slate-950 active:scale-95 transition">
          Back to Bracket
        </button>
      </div>
    );
  }

  return (
    <div className="max-w-lg mx-auto px-4 py-6 pb-24 relative">
      <button onClick={onBack} className="flex items-center gap-1 text-slate-400 text-sm font-semibold mb-4">
        <ArrowLeft size={16} /> Back to Bracket
      </button>

      {showRotateBanner && (
        <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-amber-500 text-slate-950 font-extrabold px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-2 animate-pulse">
          <Shuffle size={20} /> ROTATE PLAYERS
        </div>
      )}

      <div className="bg-gradient-to-br from-amber-500/10 to-slate-900 border border-amber-500/30 rounded-2xl p-4 mb-6 text-center">
        <p className="text-amber-400 text-xs uppercase tracking-widest font-bold mb-1 flex items-center justify-center gap-1"><Zap size={14} /> Dreambreaker &mdash; to {targetScore}, win by 2</p>
        <p className="text-slate-500 text-xs">Current matchup</p>
        <p className="text-white text-lg font-bold">{playersById[activeAId]} <span className="text-slate-500">vs</span> {playersById[activeBId]}</p>
      </div>

      <div className="grid grid-cols-2 gap-4">
        <div className="text-center">
          <p className="text-sm font-bold mb-2 flex items-center justify-center gap-1.5 text-white"><TeamDot color={teamA.color} />{teamA.name}</p>
          <p className="text-7xl font-display text-white mb-4 tabular-nums">{db.scoreA}</p>
          <button
            onClick={() => onScore('A')}
            className="w-full aspect-square rounded-3xl text-4xl font-black text-slate-950 active:scale-95 transition shadow-xl"
            style={{ backgroundColor: teamA.color.accent }}
          >
            +1
          </button>
        </div>
        <div className="text-center">
          <p className="text-sm font-bold mb-2 flex items-center justify-center gap-1.5 text-white"><TeamDot color={teamB.color} />{teamB.name}</p>
          <p className="text-7xl font-display text-white mb-4 tabular-nums">{db.scoreB}</p>
          <button
            onClick={() => onScore('B')}
            className="w-full aspect-square rounded-3xl text-4xl font-black text-slate-950 active:scale-95 transition shadow-xl"
            style={{ backgroundColor: teamB.color.accent }}
          >
            +1
          </button>
        </div>
      </div>
      <p className="text-slate-600 text-xs text-center mt-6">Rotation advances automatically every 4 combined points.</p>
    </div>
  );
}

// ---------- Leaderboard ----------

function LeaderboardView({ globalStats, partnershipStats = {} }) {
  const [tab, setTab] = useState('players'); // 'players' | 'partnerships'

  const playerRows = Object.values(globalStats || {}).sort((a, b) => {
    const wrA = a.matchesPlayed ? a.wins / a.matchesPlayed : 0;
    const wrB = b.matchesPlayed ? b.wins / b.matchesPlayed : 0;
    return wrB - wrA || b.wins - a.wins;
  });

  const pairRows = Object.values(partnershipStats || {}).sort((a, b) => {
    return (b.pointDiff - a.pointDiff) || (b.wins - a.wins) || (b.gamesPlayed - a.gamesPlayed);
  });

  return (
    <div className="max-w-4xl mx-auto px-4 py-6 pb-24">
      <h2 className="text-white text-3xl font-display uppercase tracking-wide font-semibold mb-1 flex items-center gap-2">
        <Trophy size={24} className="text-amber-400" /> All-Time Leaderboard
      </h2>
      <p className="text-slate-500 text-sm mb-5 text-balance">
        Persisted across every tournament played on this device.
      </p>

      {/* Segmented Tab Switcher */}
      <div className="flex bg-slate-900 border border-slate-800 rounded-xl p-1 mb-6 max-w-xs">
        <button
          onClick={() => setTab('players')}
          className={`flex-1 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 ${tab === 'players' ? 'bg-[#d7f24c] text-slate-950 shadow-md' : 'text-slate-400 hover:text-white'}`}
        >
          <User size={14} /> Individual
        </button>
        <button
          onClick={() => setTab('partnerships')}
          className={`flex-1 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 ${tab === 'partnerships' ? 'bg-[#d7f24c] text-slate-950 shadow-md' : 'text-slate-400 hover:text-white'}`}
        >
          <Users size={14} /> Partnerships
        </button>
      </div>

      {tab === 'players' && (
        <>
          {playerRows.length === 0 ? (
            <p className="text-slate-600 italic">No completed matches yet. Stats appear here once a match finishes.</p>
          ) : (
            <div className="overflow-x-auto bg-slate-900 border border-slate-800 rounded-2xl shadow-xl">
              <table className="w-full text-sm">
                <thead>
                  <tr className="text-slate-500 text-xs uppercase tracking-wide border-b border-slate-800">
                    <th className="text-left py-3.5 px-4">Player</th>
                    <th className="text-right py-3.5 px-3">MP</th>
                    <th className="text-right py-3.5 px-3">Win %</th>
                    <th className="text-right py-3.5 px-3">Pts Won</th>
                    <th className="text-right py-3.5 px-3">Pts Lost</th>
                    <th className="text-right py-3.5 px-4">DB +/-</th>
                  </tr>
                </thead>
                <tbody>
                  {playerRows.map((r, i) => (
                    <tr key={i} className="border-b border-slate-800/60 last:border-0 hover:bg-slate-850/50 transition">
                      <td className="py-3.5 px-4 text-white font-semibold flex items-center gap-2">
                        <span className="w-5 h-5 rounded-full bg-slate-800 text-[10px] font-mono text-slate-400 flex items-center justify-center">{i + 1}</span>
                        {r.name}
                      </td>
                      <td className="py-3.5 px-3 text-right text-slate-300 font-mono tabular-nums">{r.matchesPlayed}</td>
                      <td className="py-3.5 px-3 text-right text-slate-300 font-mono tabular-nums">{r.matchesPlayed ? Math.round((r.wins / r.matchesPlayed) * 100) : 0}%</td>
                      <td className="py-3.5 px-3 text-right text-slate-300 font-mono tabular-nums">{r.pointsWon}</td>
                      <td className="py-3.5 px-3 text-right text-slate-300 font-mono tabular-nums">{r.pointsLost}</td>
                      <td className={`py-3.5 px-4 text-right font-mono font-bold tabular-nums ${r.dreambreakerDiff > 0 ? 'text-[#d7f24c]' : r.dreambreakerDiff < 0 ? 'text-red-400' : 'text-slate-400'}`}>
                        {r.dreambreakerDiff > 0 ? '+' : ''}{r.dreambreakerDiff}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </>
      )}

      {tab === 'partnerships' && (
        <>
          {pairRows.length === 0 ? (
            <p className="text-slate-600 italic">No completed partnership games yet. Stats appear here as regulation doubles games are saved.</p>
          ) : (
            <div className="overflow-x-auto bg-slate-900 border border-slate-800 rounded-2xl shadow-xl">
              <table className="w-full text-sm">
                <thead>
                  <tr className="text-slate-500 text-xs uppercase tracking-wide border-b border-slate-800">
                    <th className="text-left py-3.5 px-4">Partnership</th>
                    <th className="text-right py-3.5 px-3">GP</th>
                    <th className="text-right py-3.5 px-3">W - L</th>
                    <th className="text-right py-3.5 px-3">Win %</th>
                    <th className="text-right py-3.5 px-3">Pts Won</th>
                    <th className="text-right py-3.5 px-3">Pts Lost</th>
                    <th className="text-right py-3.5 px-4">Diff (+/-)</th>
                  </tr>
                </thead>
                <tbody>
                  {pairRows.map((r, i) => (
                    <tr key={i} className="border-b border-slate-800/60 last:border-0 hover:bg-slate-850/50 transition">
                      <td className="py-3.5 px-4 text-white font-semibold flex items-center gap-2">
                        <span className="w-5 h-5 rounded-full bg-slate-800 text-[10px] font-mono text-slate-400 flex items-center justify-center">{i + 1}</span>
                        {r.name}
                      </td>
                      <td className="py-3.5 px-3 text-right text-slate-300 font-mono tabular-nums">{r.gamesPlayed}</td>
                      <td className="py-3.5 px-3 text-right text-slate-300 font-mono tabular-nums">{r.wins} - {r.losses}</td>
                      <td className="py-3.5 px-3 text-right text-slate-300 font-mono tabular-nums">{r.gamesPlayed ? Math.round((r.wins / r.gamesPlayed) * 100) : 0}%</td>
                      <td className="py-3.5 px-3 text-right text-slate-300 font-mono tabular-nums">{r.pointsWon}</td>
                      <td className="py-3.5 px-3 text-right text-slate-300 font-mono tabular-nums">{r.pointsLost}</td>
                      <td className={`py-3.5 px-4 text-right font-mono font-extrabold tabular-nums ${r.pointDiff > 0 ? 'text-[#d7f24c]' : r.pointDiff < 0 ? 'text-red-400' : 'text-slate-400'}`}>
                        {r.pointDiff > 0 ? '+' : ''}{r.pointDiff}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ---------- Root App ----------

function App() {
  const [view, setView] = useState('setup');
  const [playerPool, setPlayerPool] = useState([]);
  const [nextPlayerId, setNextPlayerId] = useState(1);
  const [numTeams, setNumTeams] = useState(4);
  const [goalScore, setGoalScore] = useState(11);
  const [dreambreakerScore, setDreambreakerScore] = useState(21);
  const [allowUneven, setAllowUneven] = useState(true);

  const [teams, setTeams] = useState([]);
  const [playersById, setPlayersById] = useState({});
  const [remainingPool, setRemainingPool] = useState([]);
  const [pickSequence, setPickSequence] = useState([]);
  const [pickPointer, setPickPointer] = useState(0);
  const [sittingOut, setSittingOut] = useState([]);

  const [bracket, setBracket] = useState(null);
  const [activePath, setActivePath] = useState(null);

  const [globalStats, setGlobalStats] = useState({});
  const [partnershipStats, setPartnershipStats] = useState({});
  const [priorStats, setPriorStats] = useState({});
  const [priorPartnershipStats, setPriorPartnershipStats] = useState({});
  const [savedPlayers, setSavedPlayers] = useState([]);

  const [modal, setModal] = useState(null);
  const [showRotateBanner, setShowRotateBanner] = useState(false);
  const rotateTimeoutRef = useRef(null);
  const hydrated = useRef(false);

  // Load persisted data on mount
  useEffect(() => {
    const pStats = loadGlobalStats();
    const pairStats = loadPartnershipStats();
    setGlobalStats(pStats);
    setPartnershipStats(pairStats);
    setPriorStats(pStats);
    setPriorPartnershipStats(pairStats);

    const savedKnown = loadKnownPlayers();
    const knownFromStats = Object.values(pStats).map((p) => p.name);
    const combinedKnown = Array.from(new Set([...savedKnown, ...knownFromStats].filter(Boolean)));
    setSavedPlayers(combinedKnown);
    saveKnownPlayersToStorage(combinedKnown);

    const saved = loadTournamentState();
    if (saved) {
      setView(saved.view || 'setup');
      setPlayerPool(saved.playerPool || []);
      setNextPlayerId(saved.nextPlayerId || 1);
      setNumTeams(saved.numTeams || 4);
      setGoalScore(saved.goalScore || 11);
      setDreambreakerScore(saved.dreambreakerScore || 21);
      setAllowUneven(saved.allowUneven !== undefined ? saved.allowUneven : true);
      setTeams(saved.teams || []);
      setPlayersById(saved.playersById || {});
      setRemainingPool(saved.remainingPool || []);
      setPickSequence(saved.pickSequence || []);
      setPickPointer(saved.pickPointer || 0);
      setSittingOut(saved.sittingOut || []);
      setBracket(saved.bracket || null);
      setActivePath(saved.activePath || null);
    }
    hydrated.current = true;
    return () => { if (rotateTimeoutRef.current) clearTimeout(rotateTimeoutRef.current); };
  }, []);

  // Persist tournament state on change
  useEffect(() => {
    if (!hydrated.current) return;
    saveTournamentState({
      view, playerPool, nextPlayerId, numTeams, goalScore, dreambreakerScore, allowUneven,
      teams, playersById, remainingPool, pickSequence, pickPointer, sittingOut, bracket, activePath,
    });
  }, [view, playerPool, nextPlayerId, numTeams, goalScore, dreambreakerScore, allowUneven, teams, playersById, remainingPool, pickSequence, pickPointer, sittingOut, bracket, activePath]);

  function syncTournamentStats(currentBracket, currentTeams, currentPlayers) {
    const computed = computeAllStats(priorStats, priorPartnershipStats, currentBracket, currentTeams, currentPlayers);
    setGlobalStats(computed.playerStats);
    setPartnershipStats(computed.partnershipStats);
    saveGlobalStatsToStorage(computed.playerStats);
    savePartnershipStatsToStorage(computed.partnershipStats);
  }

  function addPlayer(name) {
    const trimmed = String(name).trim();
    if (!trimmed) return;
    setPlayerPool((prev) => [...prev, { id: nextPlayerId, name: trimmed }]);
    setNextPlayerId((n) => n + 1);
    if (!savedPlayers.some((n) => n.trim().toLowerCase() === trimmed.toLowerCase())) {
      const updated = [...savedPlayers, trimmed];
      setSavedPlayers(updated);
      saveKnownPlayersToStorage(updated);
    }
  }

  function removePlayer(id) {
    setPlayerPool((prev) => prev.filter((p) => p.id !== id));
  }

  function handleAddSavedPlayer(name) {
    addPlayer(name);
  }

  function handleAddAllSavedPlayers() {
    const existingNames = new Set(playerPool.map((p) => p.name.trim().toLowerCase()));
    const toAdd = savedPlayers.filter((n) => !existingNames.has(n.trim().toLowerCase()));
    if (toAdd.length === 0) return;
    let nextId = nextPlayerId;
    const newItems = toAdd.map((name) => ({ id: nextId++, name }));
    setPlayerPool((prev) => [...prev, ...newItems]);
    setNextPlayerId(nextId);
  }

  function handleRemoveSavedPlayer(name) {
    const updated = savedPlayers.filter((n) => n.trim().toLowerCase() !== name.trim().toLowerCase());
    setSavedPlayers(updated);
    saveKnownPlayersToStorage(updated);
  }

  function handleInitializeDraft() {
    const result = initializeDraftState(playerPool, numTeams, allowUneven);
    setTeams(result.teams);
    setRemainingPool(result.remainingPool);
    setPickSequence(result.pickSequence);
    setPickPointer(0);
    setPlayersById(result.playersById);
    setSittingOut(result.sittingOut);
    setView('draft');
  }

  function draftPlayer(playerId) {
    if (pickPointer >= pickSequence.length) return;
    const teamIdx = pickSequence[pickPointer];
    setTeams((prev) => prev.map((t, i) => (i === teamIdx ? { ...t, draftOrder: [...t.draftOrder, playerId] } : t)));
    setRemainingPool((prev) => prev.filter((p) => p.id !== playerId));
    setPickPointer((p) => p + 1);
  }

  function handleGenerateBracket() {
    setBracket(generateBracket(teams));
    setView('bracket');
  }

  function getActiveMatch() {
    if (!activePath || !bracket) return null;
    return bracket.rounds[activePath.round][activePath.idx];
  }

  function openMatch(roundIdx, matchIdx) {
    const match = bracket.rounds[roundIdx][matchIdx];
    if (match.teamAId === null || match.teamBId === null) return;
    setActivePath({ round: roundIdx, idx: matchIdx });

    let workingBracket = bracket;
    if (!match.games) {
      const teamA = teams.find((t) => t.id === match.teamAId);
      const teamB = teams.find((t) => t.id === match.teamBId);
      const games = generateGames(teamA, teamB, goalScore);
      const nb = JSON.parse(JSON.stringify(bracket));
      nb.rounds[roundIdx][matchIdx].games = games;
      nb.rounds[roundIdx][matchIdx].status = 'in_progress';
      workingBracket = nb;
      setBracket(nb);
    }

    const current = workingBracket.rounds[roundIdx][matchIdx];
    if (current.status === 'complete') { setView('match'); return; }
    if (current.status === 'tied') {
      setView(current.dreambreaker && current.dreambreaker.started ? 'dreambreakerPlay' : 'dreambreakerSetup');
      return;
    }
    setView('match');
  }

  function handleSaveGame(gameId, scoreA, scoreB) {
    const { round, idx } = activePath;
    const match = bracket.rounds[round][idx];
    const teamA = teams.find((t) => t.id === match.teamAId);
    const teamB = teams.find((t) => t.id === match.teamBId);
    const updatedGames = match.games.map((g) => (g.id === gameId ? { ...g, scoreA: Number(scoreA), scoreB: Number(scoreB), saved: true } : g));
    const gamesWonA = updatedGames.filter((g) => g.saved && g.scoreA > g.scoreB).length;
    const gamesWonB = updatedGames.filter((g) => g.saved && g.scoreB > g.scoreA).length;
    const allSaved = updatedGames.every((g) => g.saved);

    let nb = JSON.parse(JSON.stringify(bracket));
    const m = nb.rounds[round][idx];
    m.games = updatedGames;
    m.gamesWonA = gamesWonA;
    m.gamesWonB = gamesWonB;

    if (allSaved) {
      if (gamesWonA === gamesWonB) {
        m.status = 'tied';
        if (!m.dreambreaker || m.winnerId !== null) {
          m.dreambreaker = {
            lineupA: [...teamA.draftOrder],
            lineupB: [...teamB.draftOrder],
            lockedA: false,
            lockedB: false,
            started: false,
            scoreA: 0,
            scoreB: 0,
            goalScore: dreambreakerScore,
            rotationIndex: 0,
            lastRotationTrigger: 0,
            playerStats: {},
            completed: false,
            winnerId: null,
          };
        }
        m.winnerId = null;
        if (round + 1 < nb.rounds.length) {
          const nextIdx = Math.floor(idx / 2);
          const slot = idx % 2 === 0 ? 'teamAId' : 'teamBId';
          nb.rounds[round + 1][nextIdx][slot] = null;
          nb.rounds[round + 1][nextIdx].status = 'pending';
        }
      } else {
        const winnerId = gamesWonA > gamesWonB ? match.teamAId : match.teamBId;
        m.status = 'complete';
        m.winnerId = winnerId;
        nb = advanceWinner(nb, round, idx, winnerId);
      }
    } else {
      m.status = 'in_progress';
      m.winnerId = null;
      if (round + 1 < nb.rounds.length) {
        const nextIdx = Math.floor(idx / 2);
        const slot = idx % 2 === 0 ? 'teamAId' : 'teamBId';
        nb.rounds[round + 1][nextIdx][slot] = null;
        nb.rounds[round + 1][nextIdx].status = 'pending';
      }
    }
    setBracket(nb);
    syncTournamentStats(nb, teams, playersById);
  }

  function handleReRandomizeExtraGames() {
    if (!activePath || !bracket) return;
    const { round, idx } = activePath;
    const match = bracket.rounds[round][idx];
    if (!match.games || match.status === 'complete') return;
    const teamA = teams.find((t) => t.id === match.teamAId);
    const teamB = teams.find((t) => t.id === match.teamBId);
    const newGames = generateGames(teamA, teamB, goalScore);
    const merged = newGames.map((g, i) => {
      const existing = match.games[i];
      if (existing && existing.saved) return existing;
      return g;
    });
    const nb = JSON.parse(JSON.stringify(bracket));
    nb.rounds[round][idx].games = merged;
    setBracket(nb);
  }

  function handleUpdateDreambreakerScore(newScore) {
    if (!activePath || !bracket) return;
    const { round, idx } = activePath;
    const nb = JSON.parse(JSON.stringify(bracket));
    if (nb.rounds[round][idx].dreambreaker) {
      nb.rounds[round][idx].dreambreaker.goalScore = newScore;
      setBracket(nb);
    }
    setDreambreakerScore(newScore);
  }

  function moveLineup(team, index, dir) {
    const { round, idx } = activePath;
    const nb = JSON.parse(JSON.stringify(bracket));
    const arr = nb.rounds[round][idx].dreambreaker[team === 'A' ? 'lineupA' : 'lineupB'];
    const to = index + dir;
    if (to < 0 || to >= arr.length) return;
    [arr[index], arr[to]] = [arr[to], arr[index]];
    setBracket(nb);
  }

  function lockLineup(team) {
    const { round, idx } = activePath;
    const nb = JSON.parse(JSON.stringify(bracket));
    nb.rounds[round][idx].dreambreaker[team === 'A' ? 'lockedA' : 'lockedB'] = true;
    setBracket(nb);
  }

  function startDreambreaker() {
    const { round, idx } = activePath;
    const nb = JSON.parse(JSON.stringify(bracket));
    nb.rounds[round][idx].dreambreaker.started = true;
    setBracket(nb);
    setView('dreambreakerPlay');
  }

  function triggerRotateBanner() {
    setShowRotateBanner(true);
    if (rotateTimeoutRef.current) clearTimeout(rotateTimeoutRef.current);
    rotateTimeoutRef.current = setTimeout(() => setShowRotateBanner(false), 2500);
  }

  function scoreDreambreakerPoint(scoringTeam) {
    const { round, idx } = activePath;
    const match = bracket.rounds[round][idx];
    const teamA = teams.find((t) => t.id === match.teamAId);
    const teamB = teams.find((t) => t.id === match.teamBId);
    const db = match.dreambreaker;
    const lenA = db.lineupA.length;
    const lenB = db.lineupB.length;
    const activeAId = db.lineupA[db.rotationIndex % lenA];
    const activeBId = db.lineupB[db.rotationIndex % lenB];
    const newScoreA = db.scoreA + (scoringTeam === 'A' ? 1 : 0);
    const newScoreB = db.scoreB + (scoringTeam === 'B' ? 1 : 0);
    const combined = newScoreA + newScoreB;
    const willRotate = combined > 0 && combined % 4 === 0 && combined !== db.lastRotationTrigger;
    const newRotationIndex = willRotate ? db.rotationIndex + 1 : db.rotationIndex;

    let nb = JSON.parse(JSON.stringify(bracket));
    const m = nb.rounds[round][idx];
    const ps = m.dreambreaker.playerStats;
    function bump(id, field) {
      const key = String(id);
      if (!ps[key]) ps[key] = { pointsWon: 0, pointsLost: 0 };
      ps[key][field] += 1;
    }
    if (scoringTeam === 'A') { bump(activeAId, 'pointsWon'); bump(activeBId, 'pointsLost'); }
    else { bump(activeBId, 'pointsWon'); bump(activeAId, 'pointsLost'); }

    m.dreambreaker.scoreA = newScoreA;
    m.dreambreaker.scoreB = newScoreB;
    m.dreambreaker.rotationIndex = newRotationIndex;
    if (willRotate) m.dreambreaker.lastRotationTrigger = combined;

    const targetScore = m.dreambreaker.goalScore || dreambreakerScore || 21;
    const isWin = (newScoreA >= targetScore || newScoreB >= targetScore) && Math.abs(newScoreA - newScoreB) >= 2;

    if (isWin) {
      const winnerId = newScoreA > newScoreB ? match.teamAId : match.teamBId;
      m.dreambreaker.completed = true;
      m.dreambreaker.winnerId = winnerId;
      nb = advanceWinner(nb, round, idx, winnerId);
    }

    setBracket(nb);
    syncTournamentStats(nb, teams, playersById);
    if (willRotate && !isWin) triggerRotateBanner();
  }

  function requestClearTournament() {
    setModal({
      title: 'New Tournament or Reset?',
      message: 'Choose whether to start a new tournament keeping your current player pool, or clear the active pool. All stats remain permanently saved in the leaderboard.',
      secondaryConfirm: {
        label: 'Start New (Keep Same Players)',
        onAction: () => {
          setPriorStats(globalStats);
          setPriorPartnershipStats(partnershipStats);
          setTeams([]);
          setPlayersById({});
          setRemainingPool([]);
          setPickSequence([]);
          setPickPointer(0);
          setSittingOut([]);
          setBracket(null);
          setActivePath(null);
          setView('setup');
          clearTournamentState();
          setModal(null);
        },
      },
      confirmLabel: 'Clear All',
      onConfirm: () => {
        setPriorStats(globalStats);
        setPriorPartnershipStats(partnershipStats);
        setPlayerPool([]);
        setNextPlayerId(1);
        setNumTeams(4);
        setGoalScore(11);
        setDreambreakerScore(21);
        setAllowUneven(true);
        setTeams([]);
        setPlayersById({});
        setRemainingPool([]);
        setPickSequence([]);
        setPickPointer(0);
        setSittingOut([]);
        setBracket(null);
        setActivePath(null);
        setView('setup');
        clearTournamentState();
        setModal(null);
      },
    });
  }

  function requestWipeStats() {
    setModal({
      title: 'Wipe All Stats?',
      message: 'This permanently deletes the all-time leaderboard and all partnership records. This cannot be undone.',
      confirmLabel: 'Wipe Stats',
      onConfirm: () => {
        saveGlobalStatsToStorage({});
        savePartnershipStatsToStorage({});
        setGlobalStats({});
        setPartnershipStats({});
        setPriorStats({});
        setPriorPartnershipStats({});
        setModal(null);
      },
    });
  }

  const activeMatch = getActiveMatch();
  const activeTeamA = activeMatch ? teams.find((t) => t.id === activeMatch.teamAId) : null;
  const activeTeamB = activeMatch ? teams.find((t) => t.id === activeMatch.teamBId) : null;

  return (
    <div className="min-h-screen bg-slate-950">
      <Header hasTournament={teams.length > 0} view={view} setView={setView} onBracketTab={() => setView(bracket ? 'bracket' : 'draft')} onClear={requestClearTournament} onWipeStats={requestWipeStats} />

      {view === 'setup' && (
        <SetupView
          playerPool={playerPool}
          addPlayer={addPlayer}
          removePlayer={removePlayer}
          savedPlayers={savedPlayers}
          onAddSavedPlayer={handleAddSavedPlayer}
          onAddAllSavedPlayers={handleAddAllSavedPlayers}
          onRemoveSavedPlayer={handleRemoveSavedPlayer}
          numTeams={numTeams}
          setNumTeams={setNumTeams}
          goalScore={goalScore}
          setGoalScore={setGoalScore}
          dreambreakerScore={dreambreakerScore}
          setDreambreakerScore={setDreambreakerScore}
          allowUneven={allowUneven}
          setAllowUneven={setAllowUneven}
          onInitializeDraft={handleInitializeDraft}
        />
      )}

      {view === 'draft' && (
        <DraftView
          teams={teams}
          remainingPool={remainingPool}
          pickSequence={pickSequence}
          pickPointer={pickPointer}
          playersById={playersById}
          sittingOut={sittingOut}
          onDraftPlayer={draftPlayer}
          onGenerateBracket={handleGenerateBracket}
        />
      )}

      {view === 'bracket' && bracket && (
        <BracketView bracket={bracket} teams={teams} onOpenMatch={openMatch} />
      )}

      {view === 'match' && activeMatch && (
        <MatchDashboard
          key={activeMatch.id}
          match={activeMatch}
          teamA={activeTeamA}
          teamB={activeTeamB}
          playersById={playersById}
          onSaveGame={handleSaveGame}
          onBack={() => setView('bracket')}
          onGoToDreambreaker={() => setView('dreambreakerSetup')}
          onGoToBracket={() => setView('bracket')}
          onReRandomizeExtra={handleReRandomizeExtraGames}
          readOnly={false}
        />
      )}

      {view === 'dreambreakerSetup' && activeMatch && (
        <DreambreakerSetupView
          match={activeMatch}
          teamA={activeTeamA}
          teamB={activeTeamB}
          playersById={playersById}
          dreambreakerScore={dreambreakerScore}
          onUpdateScoreLimit={handleUpdateDreambreakerScore}
          onMove={moveLineup}
          onLock={lockLineup}
          onStart={startDreambreaker}
          onBack={() => setView('bracket')}
        />
      )}

      {view === 'dreambreakerPlay' && activeMatch && (
        <DreambreakerPlayView
          match={activeMatch}
          teamA={activeTeamA}
          teamB={activeTeamB}
          playersById={playersById}
          dreambreakerScore={dreambreakerScore}
          showRotateBanner={showRotateBanner}
          onScore={scoreDreambreakerPoint}
          onBack={() => setView('bracket')}
        />
      )}

      {view === 'leaderboard' && (
        <LeaderboardView
          globalStats={globalStats}
          partnershipStats={partnershipStats}
        />
      )}

      <ConfirmModal modal={modal} onCancel={() => setModal(null)} />
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
